<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Solicita tu factura | Dr. Mario Quintero</title>
<link rel="stylesheet" href="portal.css">
<script src="portal.js" defer></script>
</head>
<body>
<main>
  <header class="identidad">
    <img id="logo" alt="" hidden>
    <div>
      <p id="nombre">Dr. Mario Quintero</p>
      <p id="especialidad">Radiología diagnóstica e intervencionista</p>
      <p id="cedula" hidden></p>
    </div>
  </header>

  <section class="panel" aria-labelledby="titulo">
    <h1 id="titulo">Solicita tu factura</h1>
    <p class="intro">Captura los datos de la persona o empresa a la que se emitirá la factura.</p>
    <p class="aviso" id="aviso">Vista previa. Usa datos ficticios para probar el formulario.</p>

    <form id="solicitud" aria-describedby="aviso" method="dialog">
      <label class="ancho">RFC
        <input name="rfc" maxlength="13" minlength="12" pattern="[A-Za-zÑñ&amp;]{3,4}[0-9]{6}[A-Za-z0-9]{3}" autocapitalize="characters" spellcheck="false" required>
      </label>
      <label class="ancho">Nombre o razón social
        <input name="nombre" maxlength="160" required>
      </label>
      <label>Código postal fiscal
        <input name="cp" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required>
      </label>
      <label>Régimen fiscal
        <input name="regimen" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" placeholder="Clave de 3 dígitos" required>
      </label>
      <label>Uso del CFDI
        <input name="uso" maxlength="3" pattern="[A-Za-z][A-Za-z0-9]{2}" autocapitalize="characters" required>
      </label>
      <label>Correo de entrega
        <input name="correo" type="email" maxlength="254" required>
      </label>
      <button class="ancho" id="enviar" type="button" disabled>Probar solicitud</button>
      <p class="ancho" id="resultado" role="status" hidden></p>
    </form>
  </section>
</main>
</body>
</html>
