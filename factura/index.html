<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Solicita tu factura | Dr. Mario Quintero</title>
<link rel="stylesheet" href="portal.css?v=2">
<script type="module" src="portal.js?v=6" defer></script>
</head>
<body>
<main>
  <header class="identidad">
    <img id="logo" alt="" hidden>
    <div>
      <p id="nombre">Dr. Mario Quintero</p>
      <p id="especialidad">Radiología diagnóstica e intervencionista</p>
      <p id="cedula" hidden></p>
    </div>
  </header>

  <section class="panel" aria-labelledby="titulo">
    <h1 id="titulo">Solicita tu factura</h1>
    <p class="intro">Captura los datos de la persona o empresa a la que se emitirá la factura.</p>
    <p class="aviso" id="aviso">Modo de prueba. Usa datos ficticios. El folio y el monto de prueba se verán en Cobros en este mismo navegador.</p>

    <form id="solicitud" aria-describedby="aviso" method="dialog">
      <label class="ancho">RFC
        <input id="rfc" name="rfc" aria-describedby="rfc-error" maxlength="13" minlength="12" pattern="[A-Za-zÑñ&amp;]{3,4}[0-9]{6}[A-Za-z0-9]{3}" autocapitalize="characters" spellcheck="false" required>
        <small id="rfc-error" aria-live="polite" hidden>Revisa el RFC. Debe tener 12 o 13 caracteres y seguir el formato del SAT.</small>
      </label>
      <label class="ancho">Nombre o razón social
        <input name="nombre" maxlength="160" required>
      </label>
      <label>Código postal fiscal
        <small>El que aparece en tu constancia fiscal.</small>
        <input name="cp" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required>
      </label>
      <label class="ancho">Dirección fiscal
        <input name="direccion" required maxlength="240" autocomplete="off" placeholder="Calle, número, colonia y municipio">
      </label>
      <label>Régimen fiscal
        <select name="regimen" required><option value="">Selecciona tu régimen</option></select>
      </label>
      <label>Uso del CFDI
        <select name="uso" required><option value="">Selecciona el uso</option></select>
      </label>
      <label>Correo de entrega
        <input name="correo" type="email" maxlength="254" required>
      </label>
      <label class="ancho">Monto de la factura (MXN)
        <input name="monto" type="number" inputmode="decimal" min="0.01" max="999999999.99" step="0.01" required>
      </label>
      <label class="ancho">¿Cómo pagaste?
        <select name="pago" required>
          <option value="">Selecciona la forma de pago</option>
          <option value="debito">Tarjeta de débito</option>
          <option value="credito">Tarjeta de crédito</option>
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia electrónica (SPEI)</option>
          <option value="cheque">Cheque nominativo</option>
          <option value="otro">Otro</option>
          <option value="pendiente">Aún no he pagado</option>
        </select>
      </label>
      <button class="ancho" id="enviar" type="button" disabled>Probar solicitud</button>
      <p class="ancho" id="resultado" role="status" hidden></p>
    </form>
  </section>
</main>
</body>
</html>
